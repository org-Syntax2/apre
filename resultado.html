<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultado de la Suma</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 360px;
      text-align: center;
    }
    h2 { color: #2c3e50; margin-bottom: 10px; }
    .result-box {
      font-size: 42px;
      font-weight: bold;
      color: #2da44e;
      background: #f0fdf4;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      border: 1px solid #bbf7d0;
    }
    .btn {
      background-color: #0969da;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
      text-decoration: none;
      display: inline-block;
      box-sizing: border-box;
    }
    .btn:hover { background-color: #0860ca; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Resultado Acumulado</h2>
    <p style="color: #555;" id="texto-operacion">Calculando...</p>
    
    <div class="result-box" id="caja-resultado">0</div>

    <a href="index.html" class="btn">Volver a Ingreso</a>
  </div>

  <script>
    // Recuperamos los números ingresados
    let n1 = parseFloat(localStorage.getItem('n1')) || 0;
    let n2 = parseFloat(localStorage.getItem('n2')) || 0;
    let suma = n1 + n2;

    // Mostramos el detalle en pantalla
    document.getElementById('texto-operacion').innerHTML = `La suma de <strong>${n1}</strong> + <strong>${n2}</strong> es:`;
    document.getElementById('caja-resultado').innerText = suma;
  </script>

</body>
</html>
