name: Django Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pruebas-django:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Django y dependencias
        run: |
          python -m pip install --upgrade pip
          pip install django
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        working-directory: proyecto_suma

      - name: Ejecutar pruebas de Django
        run: |
          python manage.py test
        working-directory: proyecto_suma

      - name: Publicar enlace y resumen en Actions
        run: |
          echo "### 🚀 Verificación de Django Exitosa" >> $GITHUB_STEP_SUMMARY
          echo "El pipeline de Integración Continua validó la aplicación Django correctamente." >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Enlace a la interfaz publicada en GitHub Pages:** [Ver Aplicación](https://org-syntax2.github.io/apre/)" >> $GITHUB_STEP_SUMMARY