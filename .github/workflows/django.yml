name: Django CI & Artifact

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ejecutar-django:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Django
        run: |
          python -m pip install --upgrade pip
          pip install django
        working-directory: proyecto_suma

      - name: Ejecutar pruebas de Django
        run: |
          python manage.py test
        working-directory: proyecto_suma

      - name: Subir artefacto de Django
        uses: actions/upload-artifact@v4
        with:
          name: resultado-django
          path: proyecto_suma/resultado.txt