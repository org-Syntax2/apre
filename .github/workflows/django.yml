name: Django CI & Artifact

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ejecutar-django-suma:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Django
        run: |
          python -m pip install --upgrade pip
          pip install django
        working-directory: proyecto_suma

      - name: Probar ejecucion de suma en Django
        run: |
          # Ejecuta una instrucción en Python para simular/generar la suma en resultado.txt
          python -c "num1 = 25; num2 = 35; suma = num1 + num2; open('resultado.txt', 'w', encoding='utf-8').write(str(suma))"
        working-directory: proyecto_suma

      - name: Subir resultado como artefacto de Django
        uses: actions/upload-artifact@v4
        with:
          name: resultado-django
          path: proyecto_suma/resultado.txt