name: Automatizacion de Suma

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ejecutar-suma:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar script de suma
        run: |
          # Aquí ejecutas tu script pasando los números que deseas sumar
          python sumar.py 20 40

      - name: Subir resultado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: resultado-suma
          path: resultado.txt