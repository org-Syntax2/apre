name: Desplegar Django en GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install django

      - name: Compilar y exportar Django
        run: |
          cd proyecto_suma
          python manage.py collectstatic --noinput

      - name: Hacer Commit y Push del resultado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: actualización del despliegue Django"