<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora - Ingreso</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 360px;
      text-align: center;
    }
    h2 { color: #2c3e50; margin-bottom: 20px; }
    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .input-group label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-weight: 600;
    }
    .input-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }
    .btn {
      background-color: #0969da;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
      margin-top: 10px;
    }
    .btn:hover { background-color: #0860ca; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Ingresa los Números</h2>
    
    <form action="resultado.html" method="GET" onsubmit="guardarNumeros(event)">
      <div class="input-group">
        <label for="num1">Número 1:</label>
        <input type="number" id="num1" name="n1" required placeholder="Ej: 37">
      </div>

      <div class="input-group">
        <label for="num2">Número 2:</label>
        <input type="number" id="num2" name="n2" required placeholder="Ej: 89">
      </div>

      <button type="submit" class="btn">Sumar y ver Resultado</button>
    </form>
  </div>

  <script>
    function guardarNumeros(event) {
      let n1 = document.getElementById('num1').value;
      let n2 = document.getElementById('num2').value;
      // Guardamos temporalmente en el navegador para pasarlo a la otra página
      localStorage.setItem('n1', n1);
      localStorage.setItem('n2', n2);
    }
  </script>

</body>
</html>
